# h2-test profile：零外部依赖（H2 内存库 + 关闭 z-config/z-rpc）
#
# 用途：本地最快验证 + 端到端测试。启动后：
#   健康检查   GET  http://localhost:8080/api/wf/health
#   接口文档   http://localhost:8080/doc.html   (Knife4j)
#   待办列表   GET  http://localhost:8080/api/approval-center/tasks/todo?userId=manager

spring.datasource.url=jdbc:h2:mem:z_wf;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 内存库仍然走 JDBC 持久化实现 —— 这样能顺带验证 DDL 与 SQL 在真实数据库上是对的
z.wf.persistence=jdbc
z.wf.auto-initialize-schema=true

# 关闭外部依赖
z.config.enabled=false
z.rpc.enabled=false

# 流程定义照常部署（classpath 下的 starter 里的两个示例）
z.wf.deploy-on-startup=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.zifang.z.wf=DEBUG
