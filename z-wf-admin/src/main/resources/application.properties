# ===== z-wf-admin 独立应用配置 =====
# 所有凭据一律经环境变量注入，禁止写进本文件或打进镜像层。

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}
spring.application.name=z-wf-admin

# ===== 数据源（z-wf 的 JDBC 持久化落库）=====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/z_wf?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.druid.initial-size=2
spring.datasource.druid.min-idle=2
spring.datasource.druid.max-active=20
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.validation-query=SELECT 1

# ===== z-wf 引擎 =====
# 一律走环境变量占位：容器部署时由 docker-compose / k8s 注入，
# 凭据与开关都不进镜像层。
z.wf.enabled=${Z_WF_ENABLED:true}
# memory | jdbc —— 生产走 jdbc
z.wf.persistence=${Z_WF_PERSISTENCE:jdbc}
z.wf.deploy-on-startup=${Z_WF_DEPLOY_ON_STARTUP:true}
z.wf.process-path=${Z_WF_PROCESS_PATH:classpath*:processes/*.bpmn}
# 条件求值失败时是否放行。false = 卡住等人处理（审批场景的正确默认值）。
# 注意：这个开关打开等于明确接受"条件写错会静默通过"，只在确认
# "卡住比放行更糟"的非审批场景才应打开。
z.wf.fail-open=${Z_WF_FAIL_OPEN:false}
# jdbc 模式下自动建 ZWF_* 表。生产建议先手工执行 DDL 后置 false，
# 让 schema 变更走评审而不是靠容器启动副作用。
z.wf.auto-initialize-schema=${Z_WF_AUTO_INITIALIZE_SCHEMA:true}

# ===== 服务治理（可选，h2-test profile 关闭）=====
z.config.enabled=${Z_CONFIG_ENABLED:false}
z.rpc.enabled=${Z_RPC_ENABLED:false}
z.rpc.server-port=${Z_RPC_SERVER_PORT:20880}

# ===== 入站鉴权（2026-10-22，TASK-20261022-024）=====
# z-wf 不经网关、不挂主壳 SSO 闸门 ⇒ 它**必须自带**入站鉴权。
# 改法只有一条：应用层拦截器（z-wf-admin 的 WfAuthInterceptor），
# 「把路径加进主壳 sso.intercept-paths」对它无效。
#
# 凭据来源（至少配一个，否则 fail-closed ⇒ /api/** 一律 503）：
#   Z_WF_AUTH_TOKENS      服务令牌，逗号分隔，元素形如 name:secret（name 只进审计日志）
#   Z_WF_SSO_JWT_SECRET   主壳 SSO 票据的 HS256 密钥（与 z-ctc 同一枚），
#                         配了就可用主壳同口径的 Authorization: Bearer <jwt> 或
#                         Cookie sso_token / zctc_token 调 z-wf
# ⚠ 两者都从环境变量注入（k8s Secret），**不进镜像层、不进 git**。
z.wf.auth.enabled=${Z_WF_AUTH_ENABLED:true}
z.wf.auth.protected-paths=/api/**
z.wf.auth.exclude-paths=/api/wf/health/probe,/error
z.wf.auth.tokens=${Z_WF_AUTH_TOKENS:}
z.wf.auth.sso-jwt-secret=${Z_WF_SSO_JWT_SECRET:}
z.wf.auth.cookie-names=sso_token,zctc_token

# ===== 访问日志（可观测性，2026-10-22）=====
# 两层日志各管一件事：
#   Tomcat access log —— 连接层（来源 IP / UA / 状态码 / 耗时）
#   [WF-ACCESS] 审计行 —— 应用层主体（用的哪个凭据）+ 业务路径（谁在什么时候调了哪个端点）
# ⚠ 审计行才是「事后可归因」的那一层：2026-10-22 首次上线时没有访问日志，
#   Pod 里那组 08:58 的请求至今无法证明也无法排除是被谁发的。
server.tomcat.accesslog.enabled=${Z_WF_ACCESS_LOG_ENABLED:true}
server.tomcat.accesslog.directory=${Z_WF_ACCESS_LOG_DIR:/tmp/zwf-tmp}
server.tomcat.accesslog.prefix=zwf-access
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D "%{User-Agent}i"

# ===== 日志 =====
logging.level.root=INFO
logging.level.com.zifang.z.wf=INFO
